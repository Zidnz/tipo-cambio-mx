name: Actualizar tipo de cambio

on:
  schedule:
    # Lunes a viernes, 13:23 hora de CDMX (19:23 UTC). Banxico publica el FIX alrededor de las 12:00.
    - cron: "23 19 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  etl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Pruebas
        run: pytest -q

      - name: Ejecutar pipeline
        id: etl
        env:
          BANXICO_TOKEN: ${{ secrets.BANXICO_TOKEN }}
        run: python src/pipeline.py

      - name: Guardar datos nuevos
        if: steps.etl.outputs.cambio == 'true'
        run: |
          git config user.name "Omar Gutierrez"
          git config user.email "144751297+Zidnz@users.noreply.github.com"
          git add docs/data
          git commit -m "datos: FIX ${{ steps.etl.outputs.fecha }} = ${{ steps.etl.outputs.fix }}"
          git push
